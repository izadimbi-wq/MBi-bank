name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate the project source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 2 -type f -name 'MBI-bank-project-source.zip' -print)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one MBI-bank-project-source.zip in the repository." >&2
            exit 1
          fi
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP (ignore repository root source files)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/mbi-project"
          mkdir -p "$RUNNER_TEMP/mbi-project"
          unzip -q "${{ steps.source.outputs.zip }}" -d "$RUNNER_TEMP/mbi-project"
          test -f "$RUNNER_TEMP/mbi-project/settings.gradle.kts"
          test -f "$RUNNER_TEMP/mbi-project/app/build.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK from extracted ZIP only
        run: gradle -p "$RUNNER_TEMP/mbi-project" --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBI-bank-debug-apk
          path: ${{ runner.temp }}/mbi-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
