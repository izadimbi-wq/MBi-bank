name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          test -f Saba_Portfolio_Manager_GitHub_Ready.zip
          rm -rf project
          mkdir -p project
          unzip -q Saba_Portfolio_Manager_GitHub_Ready.zip -d project

      - name: Find and validate Android project
        shell: bash
        run: |
          GRADLEW_PATH="$(find "$GITHUB_WORKSPACE/project" -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found inside the ZIP archive."
            echo "Archive contents:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory was not found beside gradlew."
            echo "Detected project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type d
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/gradle" ]; then
            echo "ERROR: gradle directory was not found beside gradlew."
            echo "Detected project directory: $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo "Detected project directory: $PROJECT_DIR"
            exit 1
          fi

          chmod +x "$GRADLEW_PATH"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saba-Portfolio-Manager-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
