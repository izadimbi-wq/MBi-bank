name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: |
          rm -rf project
          unzip -q Saba_Portfolio_Manager_GitHub_Ready.zip -d project
          chmod +x project/gradlew

      - name: Check project structure
        run: |
          test -f project/gradlew
          test -d project/app
          test -d project/gradle
          test -f project/settings.gradle.kts
          echo "Android project structure OK"

      - name: Build Debug APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saba-Portfolio-Manager-debug
          path: project/app/build/outputs/apk/debug/*.apk
