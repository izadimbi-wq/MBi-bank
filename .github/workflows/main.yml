name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ONLY the source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$GITHUB_WORKSPACE/MBI-bank-final-upload-v2.zip"
          SOURCE_DIR="$RUNNER_TEMP/mbi-bank-source"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$SOURCE_ZIP" -d "$SOURCE_DIR"

          echo "Source ZIP extracted successfully."
          echo "Source directory: $SOURCE_DIR"

      - name: Find and validate Android project inside ZIP
        shell: bash
        run: |
          set -e

          SOURCE_DIR="$RUNNER_TEMP/mbi-bank-source"

          GRADLEW_PATH="$(find "$SOURCE_DIR" -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found inside MBI-bank-final-upload-v2.zip."
            echo "ZIP contents:"
            find "$SOURCE_DIR" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Android project detected at:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory was not found beside gradlew."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/gradle/wrapper" ]; then
            echo "ERROR: Gradle wrapper directory was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          chmod +x "$GRADLEW_PATH"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "BUILD SOURCE: ZIP ONLY"
          echo "PROJECT_DIR: $PROJECT_DIR"
          echo "======================================"

      - name: Build Debug APK from extracted ZIP only
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBI-bank-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
