name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ONLY the source ZIP
        shell: bash
        run: |
          set -e

          SOURCE_ZIP="$GITHUB_WORKSPACE/MBI-bank-final-upload-v2.zip"
          SOURCE_DIR="$RUNNER_TEMP/mbi-bank-source"

          echo "=========================================="
          echo "CHECKING OUTER SOURCE ZIP"
          echo "=========================================="

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$SOURCE_ZIP"
            exit 1
          fi

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$SOURCE_ZIP" -d "$SOURCE_DIR"

          echo "Outer ZIP extracted successfully."

          INNER_ZIP="$SOURCE_DIR/MBI-bank-project-source.zip"

          if [ ! -f "$INNER_ZIP" ]; then
            echo "ERROR: MBI-bank-project-source.zip was not found."
            echo ""
            echo "Outer ZIP contents:"
            find "$SOURCE_DIR" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_SOURCE_DIR="$SOURCE_DIR/project"

          rm -rf "$PROJECT_SOURCE_DIR"
          mkdir -p "$PROJECT_SOURCE_DIR"

          unzip -q "$INNER_ZIP" -d "$PROJECT_SOURCE_DIR"

          echo "Inner Android project ZIP extracted successfully."

      - name: Find and validate Android project
        shell: bash
        run: |
          set -e

          PROJECT_SOURCE_DIR="$RUNNER_TEMP/mbi-bank-source/project"

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          GRADLEW_PATH="$(find "$PROJECT_SOURCE_DIR" -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found inside MBI-bank-project-source.zip."
            echo ""
            echo "Extracted project files:"
            find "$PROJECT_SOURCE_DIR" -maxdepth 7 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "=========================================="

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory was not found beside gradlew."
            echo "Detected project directory: $PROJECT_DIR"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/gradle/wrapper" ]; then
            echo "ERROR: gradle/wrapper directory was not found."
            echo "Detected project directory: $PROJECT_DIR"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo "Detected project directory: $PROJECT_DIR"
            exit 1
          fi

          chmod +x "$GRADLEW_PATH"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK from extracted ZIP only
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING ANDROID PROJECT"
          echo "=========================================="
          echo "Source: MBI-bank-project-source.zip"
          echo "Project: ${{ env.PROJECT_DIR }}"
          echo "=========================================="

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBI-bank-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
