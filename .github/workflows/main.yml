name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q Saba_Portfolio_Manager_GitHub_Ready.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort | head -200

          GRADLEW="$(find project -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found in the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project directory: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts" || test -f "$PROJECT_DIR/settings.gradle"
          test -d "$PROJECT_DIR/app"
          test -d "$PROJECT_DIR/gradle"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          echo "PROJECT_DIR=$PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/gradlew"
          test -d "$PROJECT_DIR/app"
          test -d "$PROJECT_DIR/gradle"
          echo "Android project structure OK"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon --stacktrace --info assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saba-Portfolio-Manager-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
